name: dependency-review
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
  pull-requests: write
jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          # Fail the PR if it introduces a dependency with a known moderate+
          # vulnerability or a license incompatible with Apache-2.0.
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
