name: stale
on:
  schedule:
    - cron: "30 3 * * *" # 03:30 UTC daily
  workflow_dispatch:
permissions:
  issues: write
  pull-requests: write
jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-stale: 60
          days-before-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: "security,pinned,help wanted,good first issue,roadmap,breaking"
          exempt-pr-labels: "security,pinned,help wanted,roadmap,breaking"
          stale-issue-message: >
            This issue has been inactive for 60 days and is marked `stale`.
            It will be closed in 14 days unless there is new activity or the
            label is removed. Comment to keep it open, or close it if resolved.
          stale-pr-message: >
            This PR has been inactive for 60 days and is marked `stale`. It
            will be closed in 14 days unless there is new activity or the label
            is removed. Push an update or comment to keep it alive.
          close-issue-message: >
            Closed as stale. Reopen with a comment if this is still relevant.
          close-pr-message: >
            Closed as stale. Reopen or re-push if you still want to merge this.
          operations-per-run: 30
