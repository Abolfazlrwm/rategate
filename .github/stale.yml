# Mark issues and PRs stale after 60 days of inactivity, close 14 days later.
daysUntilStale: 60
daysUntilClose: 14
exemptLabels:
  - security
  - pinned
  - "help wanted"
  - "good first issue"
  - roadmap
  - breaking
staleLabel: stale
markComment: >
  This has been inactive for 60 days and is marked `stale`. It will be closed
  in 14 days unless there is new activity or the label is removed. Comment to
  keep it open, or close it if it is resolved.
closeComment: >
  Closed as stale. Reopen with a comment if this is still relevant.
limitPerRun: 30
