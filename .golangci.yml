run:
  timeout: 5m
  go: "1.23"
  modules-download-mode: readonly

linters:
  enable:
    - errcheck
    - gosec
    - revive
    - gocyclo
    - gofmt
    - goimports
    - unused
    - staticcheck
    - ineffassign
    - misspell
    - unconvert
    - prealloc
    - nolintlint
    - gocritic
    - bodyclose
    - rowserrcheck
    - sqlclosecheck
    - noctx
    - nilerr
    - contextcheck

linters-settings:
  gocyclo:
    min-complexity: 15
  revive:
    severity: warning
    rules:
      - name: exported
        disabled: false
      - name: var-naming
      - name: context-as-argument
      - name: error-return
      - name: error-strings
      - name: if-return
      - name: increment-decrement
      - name: range
      - name: error-naming
      - name: receiver-naming
  gosec:
    excludes:
      - G104  # unhandled errors are caught by errcheck
  gocritic:
    enabled-tags:
      - diagnostic
      - performance
      - style
  prealloc:
    simple: true
    for-loops: true
  nolintlint:
    require-explanation: true
    require-specific: true

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
        - gocyclo
        - prealloc
        - goerr113
    - path: cmd/
      linters:
        - gocyclo
  max-issues-per-linter: 0
  max-same-issues: 0
  fix: false

output:
  formats:
    - format: colored-line-number
  sort-results: true
