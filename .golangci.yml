version: "2"
run:
  go: "1.26"
  modules-download-mode: readonly
output:
  formats:
    text:
      path: stdout
linters:
  enable:
    - bodyclose
    - contextcheck
    - gocritic
    - gocyclo
    - gosec
    - misspell
    - nilerr
    - noctx
    - nolintlint
    - prealloc
    - revive
    - rowserrcheck
    - sqlclosecheck
    - unconvert
  settings:
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
      disabled-checks:
        - hugeParam  # Options structs passed by value for SDK ergonomics; mirrors the existing NewRedisStore convention
        - httpNoBody # nil request body is idiomatic in handlers/tests
    gocyclo:
      min-complexity: 15
    gosec:
      excludes:
        - G104  # unhandled errors are caught by errcheck
        - G115  # int->uint32 for shard modulo; shard counts are tiny (false positive)
    nolintlint:
      require-explanation: true
      require-specific: true
    prealloc:
      simple: true
      for-loops: true
    revive:
      severity: warning
      rules:
        - name: exported
          disabled: false
        - name: var-naming
        - name: context-as-argument
        - name: error-return
        - name: error-strings
        - name: if-return
        - name: increment-decrement
        - name: range
        - name: error-naming
        - name: receiver-naming
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - err113
          - gocyclo
          - gosec
          - noctx
          - prealloc
        path: _test\.go
      - linters:
          - gocyclo
        path: cmd/
    paths:
      - third_party$
      - builtin$
      - examples/
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  fix: false
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples/
