<!doctype html><html><head><meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;background:#020617}
  body{width:1280px;height:640px}
</style></head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="RateGate — rate limiting you can watch work">
  <defs>
    <linearGradient id="og-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111c34"/>
    </linearGradient>
    <linearGradient id="og-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="og-halo" cx="22%" cy="46%" r="40%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="og-halo2" cx="86%" cy="74%" r="38%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#og-bg)"/>
  <rect width="1280" height="640" fill="url(#og-halo)"/>
  <rect width="1280" height="640" fill="url(#og-halo2)"/>

  <!-- top hairline -->
  <rect x="80" y="80" width="1120" height="2" rx="1" fill="#1e293b"/>

  <!-- repo url, top-right -->
  <text x="1200" y="64" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="18" font-weight="600" fill="#64748b" text-anchor="end">github.com/Abolfazlrwm/rategate</text>

  <!-- logo mark, left -->
  <g transform="translate(150,300)">
    <path d="M-66 -66 V66 M66 -66 V66 M-66 -66 H66" fill="none" stroke="url(#og-accent)" stroke-width="12" stroke-linecap="round"/>
    <rect x="-46" y="-14" width="92" height="28" rx="14" fill="#020617" stroke="url(#og-accent)" stroke-width="5"/>
    <circle cx="0" cy="0" r="13" fill="url(#og-accent)"/>
    <g stroke="url(#og-accent)" stroke-width="7" stroke-linecap="round" opacity="0.55">
      <path d="M-104 -26 h16 M-114 0 h26 M-104 26 h16"/>
    </g>
    <g stroke="#34d399" stroke-width="7" stroke-linecap="round" opacity="0.75">
      <path d="M90 -26 h16 M80 0 h26 M90 26 h16"/>
    </g>
  </g>

  <!-- wordmark -->
  <text x="300" y="250" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="104" font-weight="800" fill="#f8fafc" letter-spacing="-2">
    Rate<tspan fill="url(#og-accent)">Gate</tspan>
  </text>
  <text x="306" y="306" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="34" font-weight="600" fill="#e2e8f0">
    Rate limiting you can watch work.
  </text>
  <text x="306" y="346" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="18" font-weight="500" fill="#64748b">
    Distributed rate limiter for Go — self-hosted, no SaaS tax.
  </text>

  <!-- feature pills -->
  <g font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="600">
    <g transform="translate(306,392)">
      <rect x="0" y="0" width="178" height="40" rx="20" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5" opacity="0.95"/>
      <text x="89" y="26" fill="#67e8f9" text-anchor="middle">Token bucket</text>
    </g>
    <g transform="translate(496,392)">
      <rect x="0" y="0" width="200" height="40" rx="20" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5" opacity="0.95"/>
      <text x="100" y="26" fill="#67e8f9" text-anchor="middle">Sliding window</text>
    </g>
    <g transform="translate(708,392)">
      <rect x="0" y="0" width="172" height="40" rx="20" fill="#0f172a" stroke="#a78bfa" stroke-width="1.5" opacity="0.95"/>
      <text x="86" y="26" fill="#ede9fe" text-anchor="middle">Adaptive AIMD</text>
    </g>
    <g transform="translate(892,392)">
      <rect x="0" y="0" width="156" height="40" rx="20" fill="#0f172a" stroke="#475569" stroke-width="1.5" opacity="0.95"/>
      <text x="78" y="26" fill="#cbd5e1" text-anchor="middle">gRPC + REST</text>
    </g>
    <g transform="translate(1060,392)">
      <rect x="0" y="0" width="140" height="40" rx="20" fill="#0f172a" stroke="#475569" stroke-width="1.5" opacity="0.95"/>
      <text x="70" y="26" fill="#cbd5e1" text-anchor="middle">Redis</text>
    </g>
  </g>

  <!-- particle flow motif, bottom band -->
  <g transform="translate(80,540)">
    <g fill="url(#og-accent)">
      <circle cx="40" cy="0" r="3" opacity="0.18"/>
      <circle cx="90" cy="6" r="3" opacity="0.28"/>
      <circle cx="140" cy="-4" r="3" opacity="0.4"/>
      <circle cx="190" cy="8" r="3.5" opacity="0.55"/>
      <circle cx="240" cy="-2" r="3.5" opacity="0.7"/>
    </g>
    <path d="M280 -22 V22 M320 -22 V22 M280 -22 H320" fill="none" stroke="url(#og-accent)" stroke-width="5" stroke-linecap="round"/>
    <rect x="284" y="-7" width="32" height="14" rx="7" fill="#020617" stroke="url(#og-accent)" stroke-width="2.5"/>
    <circle cx="300" cy="0" r="6" fill="url(#og-accent)"/>
    <g stroke="#34d399" stroke-width="4.5" stroke-linecap="round" opacity="0.8">
      <path d="M360 -14 h14 M350 0 h24 M360 14 h14"/>
    </g>
  </g>

  <!-- stat block, bottom-right -->
  <g transform="translate(1200,512)">
    <text x="0" y="0" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="15" font-weight="600" fill="#64748b" text-anchor="end">single laptop · in-memory</text>
    <text x="0" y="40" font-family="Inter, system-ui, sans-serif" font-size="44" font-weight="800" fill="url(#og-accent)" text-anchor="end">120k+ RPS · p99 &lt; 5 ms</text>
    <text x="0" y="68" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="15" font-weight="500" fill="#94a3b8" text-anchor="end">Apache-2.0 · Go 1.26 · 100% coverage on core</text>
  </g>

  <!-- bottom hairline -->
  <rect x="80" y="600" width="1120" height="2" rx="1" fill="#1e293b"/>
</svg>
</body></html>
