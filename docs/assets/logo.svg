<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="RateGate logo">
  <defs>
    <linearGradient id="lg-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="lg-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="lg-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- tile -->
  <rect width="256" height="256" rx="56" fill="url(#lg-bg)"/>
  <rect x="6" y="6" width="244" height="244" rx="52" fill="none" stroke="url(#lg-accent)" stroke-width="2" opacity="0.35"/>

  <!-- the gate frame -->
  <g transform="translate(128,128)" filter="url(#lg-glow)">
    <!-- two posts + lintel -->
    <path d="M-58 -58 V58 M58 -58 V58 M-58 -58 H58" fill="none" stroke="url(#lg-accent)" stroke-width="10" stroke-linecap="round"/>
    <!-- the slot (gate opening) -->
    <rect x="-40" y="-12" width="80" height="24" rx="12" fill="#020617" stroke="url(#lg-accent)" stroke-width="4"/>
    <!-- token passing through -->
    <circle cx="0" cy="0" r="11" fill="url(#lg-accent)"/>
    <!-- incoming flow ticks -->
    <g stroke="url(#lg-accent)" stroke-width="6" stroke-linecap="round" opacity="0.55">
      <path d="M-92 -22 h14 M-100 0 h22 M-92 22 h14"/>
    </g>
    <!-- admitted ticks on the right -->
    <g stroke="#34d399" stroke-width="6" stroke-linecap="round" opacity="0.7">
      <path d="M78 -22 h14 M70 0 h22 M78 22 h14"/>
    </g>
  </g>
</svg>
