<svg xmlns="http://www.w3.org/2000/svg" width="720" height="120" viewBox="0 0 720 120" role="img" aria-label="RateGate logo banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="720" height="120" rx="16" fill="url(#bg)"/>

  <!-- gate icon -->
  <g transform="translate(36,30)">
    <rect x="0" y="0" width="60" height="60" rx="10" fill="none" stroke="url(#accent)" stroke-width="3"/>
    <rect x="12" y="12" width="36" height="36" rx="6" fill="url(#accent)" opacity="0.18"/>
    <path d="M18 30 H42 M30 18 V42" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="30" cy="30" r="4" fill="url(#accent)"/>
  </g>

  <!-- wordmark -->
  <text x="124" y="58" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="40" font-weight="700" fill="#f8fafc">
    Rate<tspan fill="url(#accent)">Gate</tspan>
  </text>
  <text x="126" y="86" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="500" fill="#94a3b8">
    Distributed rate limiting for Go — token bucket + sliding window, gRPC + REST
  </text>

  <!-- right-side stat -->
  <g transform="translate(560,40)">
    <text x="0" y="0" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#64748b" text-anchor="end">throughput</text>
    <text x="0" y="28" font-family="Inter, system-ui, sans-serif" font-size="26" font-weight="700" fill="url(#accent)" text-anchor="end">120k+ RPS</text>
    <text x="0" y="50" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="500" fill="#94a3b8" text-anchor="end">p99 &lt; 5ms</text>
  </g>
</svg>
