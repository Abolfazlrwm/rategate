<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="RateGate — distributed rate limiting for Go">
  <defs>
    <linearGradient id="bn-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111c34"/>
    </linearGradient>
    <linearGradient id="bn-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="bn-halo" cx="18%" cy="50%" r="42%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="280" rx="22" fill="url(#bn-bg)"/>
  <rect width="1200" height="280" rx="22" fill="url(#bn-halo)"/>
  <rect x="1.5" y="1.5" width="1197" height="277" rx="21" fill="none" stroke="#1e293b" stroke-width="3"/>

  <!-- logo mark -->
  <g transform="translate(64,140) scale(0.5)">
    <path d="M-58 -58 V58 M58 -58 V58 M-58 -58 H58" fill="none" stroke="url(#bn-accent)" stroke-width="10" stroke-linecap="round"/>
    <rect x="-40" y="-12" width="80" height="24" rx="12" fill="#020617" stroke="url(#bn-accent)" stroke-width="4"/>
    <circle cx="0" cy="0" r="11" fill="url(#bn-accent)"/>
    <g stroke="url(#bn-accent)" stroke-width="6" stroke-linecap="round" opacity="0.55">
      <path d="M-92 -22 h14 M-100 0 h22 M-92 22 h14"/>
    </g>
    <g stroke="#34d399" stroke-width="6" stroke-linecap="round" opacity="0.7">
      <path d="M78 -22 h14 M70 0 h22 M78 22 h14"/>
    </g>
  </g>

  <!-- wordmark -->
  <text x="180" y="120" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="64" font-weight="800" fill="#f8fafc" letter-spacing="-1">
    Rate<tspan fill="url(#bn-accent)">Gate</tspan>
  </text>
  <text x="184" y="158" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="600" fill="#cbd5e1">
    Rate limiting you can watch work.
  </text>
  <text x="184" y="190" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="14" font-weight="500" fill="#64748b">
    token bucket · sliding window · adaptive AIMD · gRPC + REST · Redis / Cluster
  </text>

  <!-- particle flow into a gate, right side -->
  <g transform="translate(880,140)">
    <g fill="url(#bn-accent)">
      <circle cx="-150" cy="-26" r="3" opacity="0.25"/>
      <circle cx="-120" cy="-10" r="3" opacity="0.4"/>
      <circle cx="-95" cy="22" r="3" opacity="0.3"/>
      <circle cx="-70" cy="-18" r="3.5" opacity="0.6"/>
      <circle cx="-48" cy="8" r="3.5" opacity="0.7"/>
    </g>
    <path d="M-20 -40 V40 M20 -40 V40 M-20 -40 H20" fill="none" stroke="url(#bn-accent)" stroke-width="6" stroke-linecap="round"/>
    <rect x="-16" y="-9" width="32" height="18" rx="9" fill="#020617" stroke="url(#bn-accent)" stroke-width="3"/>
    <circle cx="0" cy="0" r="7" fill="url(#bn-accent)"/>
    <g stroke="#34d399" stroke-width="5" stroke-linecap="round" opacity="0.8">
      <path d="M40 -22 h12 M34 0 h18 M40 22 h12"/>
    </g>
    <g stroke="#fb7185" stroke-width="5" stroke-linecap="round" opacity="0.55">
      <path d="M40 -36 h8 M40 36 h8"/>
    </g>
  </g>

  <!-- stat -->
  <g transform="translate(1136,84)">
    <text x="0" y="0" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" font-weight="600" fill="#64748b" text-anchor="end">throughput</text>
    <text x="0" y="30" font-family="Inter, system-ui, sans-serif" font-size="30" font-weight="800" fill="url(#bn-accent)" text-anchor="end">120k+ RPS</text>
    <text x="0" y="54" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" font-weight="500" fill="#94a3b8" text-anchor="end">p99 &lt; 5 ms · in-memory</text>
  </g>
</svg>
