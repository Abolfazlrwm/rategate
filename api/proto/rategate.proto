syntax = "proto3";

package rategate.v1;

option go_package = "github.com/Abolfazlrwm/rategate/api/proto;rategatepb";

// RateGateService is the primary gRPC interface for rate-limit checks.
//
// A Check is a single atomic evaluation of whether one unit of work may
// proceed for a given (key, policy) pair. The server applies the configured
// algorithm and store and returns the decision.
service RateGateService {
  // CheckRateLimit evaluates the rate limit for the given key under the
  // named policy (or, if limit_name is empty, the server's default
  // algorithm with inline parameters from the policy table).
  rpc CheckRateLimit(CheckRateLimitRequest) returns (CheckRateLimitResponse);

  // HealthCheck reports liveness/readiness. The server returns SERVING when
  // it can accept traffic; NOT_SERVING when the store is unreachable or a
  // fatal error has occurred.
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
}

message CheckRateLimitRequest {
  // key is the rate-limit identity (e.g. "user:42", "ip:10.0.0.1",
  // "tenant:acme:api:write"). Required.
  string key = 1;

  // limit_name references a pre-configured policy by name. Optional; when
  // omitted the server applies the default algorithm with the inline
  // fields below.
  string limit_name = 2;

  // Inline policy (used only when limit_name is empty).
  string algorithm = 3;            // "tokenbucket" | "slidingwindow"
  int64  limit = 4;                // burst capacity / window count
  double refill_per_second = 5;    // token bucket only
  int64  window_ms = 6;            // sliding window only
}

message CheckRateLimitResponse {
  bool   allowed = 1;
  int64  remaining = 2;
  int64  limit = 3;
  int64  reset_at_unix_ms = 4;
  int64  retry_after_ms = 5;
  string algorithm = 6;            // the algorithm actually used
}

message HealthCheckRequest {}

message HealthCheckResponse {
  enum ServingStatus {
    SERVING_STATUS_UNSPECIFIED = 0;
    SERVING = 1;
    NOT_SERVING = 2;
  }
  ServingStatus status = 1;
}

// AdminService manages rate-limit policies at runtime (Phase 2). Mutations are
// applied to the same thread-safe Registry the CheckRateLimit path reads, so a
// created or updated policy is immediately visible to subsequent
// CheckRateLimit calls without a restart. Mirrors the REST
// /v1/admin/policies API; both transports share one Registry.
service AdminService {
  // ListPolicies returns every registered policy, sorted by name.
  rpc ListPolicies(ListPoliciesRequest) returns (ListPoliciesResponse);

  // CreatePolicy adds a new policy. Returns ALREADY_EXISTS if the name is
  // taken, INVALID_ARGUMENT if the policy fails validation.
  rpc CreatePolicy(CreatePolicyRequest) returns (Policy);

  // GetPolicy fetches one policy by name. Returns NOT_FOUND if missing.
  rpc GetPolicy(GetPolicyRequest) returns (Policy);

  // UpdatePolicy overwrites an existing policy. The name in the request must
  // match policy.name (no rename via Update). Returns NOT_FOUND if the named
  // policy does not exist.
  rpc UpdatePolicy(UpdatePolicyRequest) returns (Policy);

  // DeletePolicy removes a policy. Returns NOT_FOUND if missing. A deleted
  // policy is immediately unknown to CheckRateLimit.
  rpc DeletePolicy(DeletePolicyRequest) returns (DeletePolicyResponse);
}

// Policy is the canonical representation of a named limit policy, shared by
// the Create/Get/Update responses.
message Policy {
  string name = 1;
  string algorithm = 2;          // "tokenbucket" | "slidingwindow" | "adaptive"
  int64  limit = 3;              // floor (adaptive) / burst (tokenbucket) / window count (slidingwindow)
  double refill_per_second = 4;  // token bucket only
  int64  window_ms = 5;          // sliding window / adaptive only
}

message ListPoliciesRequest {}

message ListPoliciesResponse {
  repeated Policy policies = 1;
}

message CreatePolicyRequest {
  Policy policy = 1;             // required; policy.name must be non-empty and unique
}

message GetPolicyRequest {
  string name = 1;               // required
}

message UpdatePolicyRequest {
  string name = 1;               // identifies the policy to update; must equal policy.name
  Policy policy = 2;             // required
}

message DeletePolicyRequest {
  string name = 1;               // required
}

message DeletePolicyResponse {}
